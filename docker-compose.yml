version: '3.8'
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: portfolio_db
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    # .env의 GOOGLE_*, JWT_SECRET, APP_* 등을 컨테이너에 전달 (아래 environment 값이 우선 적용)
    env_file:
      - path: .env
        required: false
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - redis
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  mysql_data:
